# Weekly update PRs for Go modules and for the GitHub Actions the workflows use.
# Actions are pinned to commit SHAs; Dependabot bumps the SHA and its version
# comment together.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
