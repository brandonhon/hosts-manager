name: Release

# Push a tag to release:  git tag v1.2.3 && git push origin v1.2.3
# A tag with a suffix (v1.2.3-rc.1) is published as a prerelease.
# Builds, archives, checksums and notes are all defined in .goreleaser.yaml.
on:
  push:
    tags: ['v*']

# The repo's default workflow token is read-only; creating a release needs write.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the history back to the previous tag

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
