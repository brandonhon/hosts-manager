name: CI

# No paths filter, on purpose: `Quality Gate` is a required check on main, and a
# filtered-out workflow is reported as skipped, not passed, so the PR could
# never merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make test
      - run: make build
      # go run rather than ./build/hosts-manager: the Windows build has no .exe
      # suffix, which PowerShell will not execute.
      - run: go run ./cmd/hosts-manager --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Go that go.mod declares, not "stable": golangci-lint cannot load the
      # standard library of a Go release newer than the one it was built with,
      # and fails with "could not import fmt" on every package when stable moves
      # past it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Action v7+ is required for golangci-lint v2. Keep the version in sync
      # with GOLANGCI_VERSION in the Makefile.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Keep GOSEC_VERSION in sync with the Makefile. Any finding fails the job.
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make sec

  # The single required status check on main.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    steps:
      - run: echo "All checks passed."
