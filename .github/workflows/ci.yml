name: CI

# Tag pushes are deliberately not handled here — release.yml owns tags. Mixing
# a tag trigger with the paths filter below made tag-push behaviour erratic.
on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'

# The repo's default workflow token is read-only; every job here only needs to
# read the checkout. The one exception is the security job, which uploads SARIF.
permissions:
  contents: read

# Supersede in-flight runs for the same ref rather than paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 'stable'

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Report every OS rather than cancelling the others on the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup-go caches the module and build caches by default, keyed on
      # go.sum — no separate actions/cache step is needed.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: make test

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: make coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./build/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Action v7+ is required to run golangci-lint v2, which .golangci.yml
      # targets. The linter version is pinned so CI and `make install-linters`
      # agree; keep it in sync with GOLANGCI_VERSION in the Makefile.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by upload-sarif. Without it the upload fails, which was
      # invisible because the step is continue-on-error.
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securecodewarrior/gosec/cmd/gosec@latest
          gosec -fmt sarif -out results.sarif ./...
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: results.sarif

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      # A compile check plus a smoke test of the resulting binary. Release
      # builds are cross-compiled by release.yml, and the test job above
      # already compiles the tree natively on macOS and Windows, so the
      # platform-specific files (atomic_unix.go / atomic_windows.go) stay
      # covered without cross-compiling five targets on every push.
      - name: Build binary
        run: make build

      - name: Smoke test binary
        run: |
          ./build/hosts-manager --version
          ./build/hosts-manager --help

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, lint, security, build]
    steps:
      - name: Quality Gate
        run: echo "All quality checks passed."
