name: CI

# Documentation-only changes skip the build, test, lint and security jobs.
#
# That is done by the `changes` job below rather than a `paths:` filter on the
# workflow: `Quality Gate` is a required check on main, and a filtered-out
# workflow never reports it, so a docs-only PR could never merge. Here the
# workflow always runs and Quality Gate always reports.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether anything besides documentation changed. Unknown cases (a
  # first push, a base commit that is not fetchable) count as code changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit; treating as a code change."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "Changed files:"; echo "$files"
          # Documentation: Markdown, docs/, LICENSE and issue templates.
          if printf '%s\n' "$files" | grep -vqE '(\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only; skipping build, test, lint and security."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - run: make test
      - run: make build
      # go run rather than ./build/hosts-manager: the Windows build has no .exe
      # suffix, which PowerShell will not execute.
      - run: go run ./cmd/hosts-manager --version

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Go that go.mod declares, not "stable": golangci-lint cannot load the
      # standard library of a Go release newer than the one it was built with,
      # and fails with "could not import fmt" on every package when stable moves
      # past it.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Action v7+ is required for golangci-lint v2. Keep the version in sync
      # with GOLANGCI_VERSION in the Makefile.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --timeout=5m

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      # Keep GOSEC_VERSION in sync with the Makefile. Any finding fails the job.
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make sec

  # The single required status check on main. It always runs, and passes when
  # every job it depends on either passed or was skipped as docs-only.
  quality-gate:
    name: Quality Gate
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, test, lint, security]
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required job ended with: $r"; exit 1 ;;
            esac
          done
